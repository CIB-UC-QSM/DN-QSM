[project]
name = "dn-qsm"
version = "0.1.0"
description = "Joint background removal and susceptibility reconstruction with deep null space learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5", "numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9",
    "nibabel>=5.3", "comet-ml>=3.58.2",
]

[project.scripts]
dnqsm-train = "dnqsm.training:main"
dnqsm-evaluate = "dnqsm.evaluation:main"
dnqsm-overfit-cosmos = "dnqsm.overfit:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
